[package]
name = "bamboo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
material-colors = "0.5"
md5 = "0.7"

regex = "1"
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
