[package]
name = "bamboo-end-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bamboo-core = { path = "../core" }
cxx = "1"
serde_json = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
